name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium-headless-shell
      # build, exports check, size budget, publint, unit/contract tests,
      # real-browser tests (themes, axe audit) and visual regression
      - run: npm test
      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diffs-node-${{ matrix.node }}
          path: tests/visual/__diff__
          if-no-files-found: ignore
      - name: Show what would be published
        if: matrix.node == 22
        run: npm pack --dry-run

  firefox:
    name: browser tests (firefox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps firefox
      - run: npm run build
      # Same real-browser suites as the main job, in Firefox. Visual regression and
      # the prefers-reduced-transparency tests stay Chromium-only (see README).
      - run: npm run test:cascade
        env:
          BROWSER: firefox

  consumers:
    name: consumers (install the packed tarball)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Packs the tarball and installs it into a fresh project with the current
      # Vite, Vue, Sass and TypeScript. Needs the npm registry.
      - run: npm run test:consumers
