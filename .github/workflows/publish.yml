name: Publish @buefy/themes to NPM

# Publishes when a GitHub release is published from main (or on a manual run),
# after the full test suite and the consumer install tests pass. Uses npm Trusted
# Publishing (OIDC), so there is no NPM_TOKEN secret; provenance is generated
# automatically.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    # Only publish from main: releases tagged from main, or a manual run started
    # on the main branch. The npm-publish environment should enforce the same rule
    # in its settings; this keeps the workflow safe even if it does not.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'release' && github.event.release.target_commitish == 'main')
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # Trusted Publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org/"
          cache: npm
      # Trusted Publishing (OIDC) requires npm >= 11.5.1
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Check the release tag matches package.json
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "$RELEASE_TAG" ]; then
            echo "release tag $RELEASE_TAG does not match package.json version ($expected)"
            exit 1
          fi
      - run: npx playwright-core install --with-deps chromium-headless-shell
      # build, exports check, size budget, publint, unit/contract, browser, axe, visual
      - run: npm test
      # pack the tarball and install it into a fresh project
      - run: npm run test:consumers
      - run: npm publish --access public
